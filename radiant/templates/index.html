<!DOCTYPE html>
<html>
<head>
    <title>$page_title</title>
    <link rel="icon" type="image/x-icon" href="$page_favicon">
    <meta name="description" content="$page_description">
    <meta name="robots" content="index, follow">

    <meta property="og:title" content="$page_title">
    <meta property="og:description" content="$page_description">
    <meta property="og:image" content="$page_image">
    <meta property="og:url" content="$page_url">

    <meta name="twitter:card" content="$page_summary_large_image">
    <meta name="twitter:site" content="$page_site">
    <meta name="twitter:title" content="$page_title">
    <meta name="twitter:description" content="$page_description">
    <meta name="twitter:image" content="$page_image">

    <link rel="canonical" href="$page_url">

    <meta name="author" content="$page_author">
    <meta name="copyright" content="$page_copyright">


    <!--Brython-->
    <script type="text/javascript" src="$domain/brython/Brython-$brython_version/brython.js"></script>
    <script type="text/javascript" src="$domain/brython/Brython-$brython_version/brython_stdlib.js"></script>

    <script type="text/javascript" src="./radiant.brython.js"></script>
    <script type="text/javascript" src="./$package.brython.js"></script>

    <brython-options debug="$debug_level" cache="true"></brython-options>

    <script type="text/python">
        import sys

        if $mock_imports:
            from fake import Fake

        for module in $mock_imports:
            sys.modules[module] = Fake()

        from $root_file import $class_name as RadiantClass
        _ = RadiantClass.__new__(RadiantClass)
        getattr(_, "$call")()
    </script>


</head>

<body onload="brython({pythonpath: $path})">
</body>


</html>
